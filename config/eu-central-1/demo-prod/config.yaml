####  Define application's configurations
workload_account:
  account_id: '984601295324'
  environment: 'prod'
  region: 'eu-central-1'
  tags:
    Environment: "prod"
    ManagedWith: "Terraform"
    Owner: "Shad Zhang"
    Product: "demo"
  vpc:
    vpc_id: 
    cidr: 172.17.0.0/20
    name: prod-demo-vpc
    azs:
      - eu-central-1a
      - eu-central-1bt
      - eu-central-1c
    private_subnets:
      - 172.17.4.0/24
      - 172.17.5.0/24
      - 172.17.6.0/24
    public_subnets:
      - 172.17.0.0/25
      - 172.17.0.128/25
      - 172.17.1.0/25
    protected_subnets:
      - 172.17.2.0/25
      - 172.17.2.128/25
      - 172.17.3.0/25
    enable_nat_gateway: true
    single_nat_gateway: false
    enable_dns_hostnames: true
    enable_dns_support: true
    enable_flow_logs: false
    enable_ssm_endpoint: false
    ssm_endpoint_private_dns_enabled: false
    enable_ssmmessages_endpoint: false
    ssmmessages_endpoint_private_dns_enabled: false
    enable_ec2messages_endpoint: false
    ec2messages_endpoint_private_dns_enabled: false
    public_dedicated_network_acl: true
    create_security_group: false  
  efs:
    performance_mode: generalPurpose
    throughput_mode: bursting